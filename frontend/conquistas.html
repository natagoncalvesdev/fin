<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conquistas</title>
  <link rel="icon" href="img/icone.ico" type="image/x-icon" />
  <link rel="stylesheet" href="sidebar.css?v=8">
  <link rel="stylesheet" href="css/theme.css?v=6">
  <link rel="stylesheet" href="css/mobile-shell.css?v=7">
  <script src="js/fin-run-once.js"></script>
  <script src="js/fin-config.js?v=1"></script>
  <script src="js/fin-sdk.js?v=5"></script>
  <script src="sidebar.js?v=8"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--font-family);
      background: var(--bg-main);
      display: flex;
      min-height: 100vh;
      margin: 0;
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 40px;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1180px;
    }

    .medalhas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }

    .medalha-card {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      background: var(--bg-section);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .medalha-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--slate-400);
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.15);
    }
    .medalha-icon svg { width: 40px; height: 40px; }

    .medalha-card[data-nivel="ouro"] .medalha-icon {
      background: linear-gradient(150deg, #FCD34D 0%, #F59E0B 60%, #B45309 100%);
    }
    .medalha-card[data-nivel="prata"] .medalha-icon {
      background: linear-gradient(150deg, #E5E7EB 0%, #9CA3AF 60%, #6B7280 100%);
    }
    .medalha-card[data-nivel="bronze"] .medalha-icon {
      background: linear-gradient(150deg, #E9B389 0%, #CD7F32 60%, #8A5222 100%);
    }

    .medalha-titulo { font-size: 16px; font-weight: 700; }
    .medalha-nivel {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }
    .medalha-desc { font-size: 13px; color: var(--text-secondary); }
    .medalha-data { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    @media (max-width: 768px) {
      .content { max-width: 100%; padding: 20px 16px 40px; margin-left: 0; }
      .medalhas-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

  <main class="content">
    <div class="page-header">
      <h1>Conquistas</h1>
      <p>Medalhas que você ganha ao atingir metas de peso.</p>
    </div>

    <div class="section-card">
      <div class="stat-row" id="conquistaStats">
        <div class="stat-tile">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M9 15l-2 6 5-3 5 3-2-6"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Medalhas</span><span class="stat-tile-value" id="statTotal">0</span></span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-icon" style="background:rgba(245,158,11,0.16);color:#B45309;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Ouro</span><span class="stat-tile-value" id="statOuro">0</span></span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-icon" style="background:rgba(107,114,128,0.16);color:#6B7280;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Prata</span><span class="stat-tile-value" id="statPrata">0</span></span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-icon" style="background:rgba(205,127,50,0.18);color:#8A5222;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Bronze</span><span class="stat-tile-value" id="statBronze">0</span></span>
        </div>
      </div>
    </div>

    <div class="section-card">
      <h3 class="section-card-title">Suas medalhas</h3>
      <div id="listaConquistas" class="medalhas-grid">
        <p class="info-text">Carregando…</p>
      </div>
    </div>
  </main>

  <script>
    const auth = firebase.auth();
    const api = (path, opts) => window.finApi.request(path, opts);
    const nf1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const dataBR = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR');

    const MEDALHA_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5l3 7"/><path d="M16 3h3l-3 7"/><circle cx="12" cy="15" r="6"/><path d="M12 12.3l1.1 2.2 2.4.3-1.8 1.7.5 2.4-2.2-1.2-2.2 1.2.5-2.4-1.8-1.7 2.4-.3z" fill="currentColor" stroke="none"/></svg>';

    function render(itens) {
      const lista = document.getElementById('listaConquistas');
      const cont = { ouro: 0, prata: 0, bronze: 0 };
      itens.forEach((c) => { cont[c.data.nivel] = (cont[c.data.nivel] || 0) + 1; });

      document.getElementById('statTotal').textContent = itens.length;
      document.getElementById('statOuro').textContent = cont.ouro || 0;
      document.getElementById('statPrata').textContent = cont.prata || 0;
      document.getElementById('statBronze').textContent = cont.bronze || 0;

      if (!itens.length) {
        lista.innerHTML = '<div class="statement-empty">Você ainda não conquistou nenhuma medalha. Bata uma meta de peso na página Saúde!</div>';
        return;
      }

      lista.innerHTML = itens.map((c) => {
        const d = c.data;
        return `
          <div class="medalha-card" data-nivel="${d.nivel}">
            <div class="medalha-icon">${MEDALHA_SVG}</div>
            <div class="medalha-nivel">${d.nivel}</div>
            <div class="medalha-titulo">${d.titulo}</div>
            <div class="medalha-desc">${d.descricao}</div>
            <div class="medalha-data">${dataBR(d.dataConquista)}</div>
          </div>`;
      }).join('');
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        render(await api('/api/saude/conquistas'));
      } catch (err) {
        console.error('Erro ao carregar conquistas:', err);
        document.getElementById('listaConquistas').innerHTML =
          '<div class="statement-empty">Não foi possível carregar as conquistas.</div>';
      }
    });
  </script>
  <script src="js/mobile-nav.js?v=11"></script>
</body>
</html>
