<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conquistas</title>
  <link rel="icon" href="img/icone.ico" type="image/x-icon" />
  <link rel="stylesheet" href="sidebar.css?v=10">
  <link rel="stylesheet" href="css/theme.css?v=7">
  <link rel="stylesheet" href="css/mobile-shell.css?v=8">
  <script src="js/fin-run-once.js"></script>
  <script src="js/fin-config.js?v=1"></script>
  <script src="js/fin-sdk.js?v=6"></script>
  <script src="sidebar.js?v=9"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--font-family);
      background: var(--bg-main);
      display: flex;
      min-height: 100vh;
      margin: 0;
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 40px;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1180px;
    }

    .medalhas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }

    .medalha-card {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      background: var(--bg-section);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .medalha-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .medalha-icon svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .medalha-card[data-tipo="meta_guardar"] .medalha-icon { background: rgba(21,128,61,0.14); color: var(--positive); }
    .medalha-card[data-tipo="peso_inicio"] .medalha-icon { background: rgba(180,83,9,0.14); color: var(--warning); }

    .medalha-titulo { font-size: 17px; font-weight: 700; }
    .medalha-desc { font-size: 13px; color: var(--text-secondary); }
    .medalha-data { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    @media (max-width: 768px), (max-height: 500px) {
      .content { max-width: 100%; padding: 20px 16px 40px; margin-left: 0; }
      .medalhas-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .medalha-card { padding: 16px; }
    }
  </style>
</head>
<body>

  <main class="content">
    <div class="page-header">
      <h1>Conquistas</h1>
      <p>Medalhas que você ganha ao progredir no peso e nas metas de economia.</p>
    </div>

    <div class="section-card">
      <div class="stat-row">
        <div class="stat-tile">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 15l-2 6 5-3 5 3-2-6"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Total de medalhas</span><span class="stat-tile-value" id="statTotal">0</span></span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 1 4 4H8a4 4 0 0 1 4-4Z"/><path d="M5 7h14l1.6 11.2A2 2 0 0 1 18.6 21H5.4a2 2 0 0 1-2-2.8L5 7Z"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">De peso</span><span class="stat-tile-value" id="statPeso">0</span></span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8a5 5 0 0 0-5-3H9a5 5 0 0 0 0 10h1v3h4v-3h1a4 4 0 0 0 4-4Z"/><path d="M19 10h2M5 9v6"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">De cofrinhos</span><span class="stat-tile-value" id="statCofre">0</span></span>
        </div>
      </div>
    </div>

    <div class="section-card">
      <h3 class="section-card-title">Suas medalhas</h3>
      <div id="listaConquistas" class="medalhas-grid">
        <p class="info-text">Carregando…</p>
      </div>
    </div>
  </main>

  <script>
    const auth = firebase.auth();
    const api = (path, opts) => window.finApi.request(path, opts);
    const dataBR = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR');

    const ICONES = {
      bandeira: '<path d="M4 21V4M4 4l6 2 4-2 6 2v9l-6-2-4 2-6-2"/>',
      balanca: '<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a4 4 0 0 0 6 0L5 7Zm14 0-3 6a4 4 0 0 0 6 0l-3-6ZM8 5l8-1"/>',
      alvo: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
      cofre: '<path d="M19 8a5 5 0 0 0-5-3H9a5 5 0 0 0 0 10h1v3h4v-3h1a4 4 0 0 0 4-4Z"/><path d="M19 10h2M6 9h.01"/>',
      trofeu: '<path d="M8 3h8v5a4 4 0 0 1-8 0V3Z"/><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3M9 21h6M12 12v5"/>',
    };

    function render(itens) {
      const lista = document.getElementById('listaConquistas');
      const dePeso = itens.filter((x) => x.data.tipo.startsWith('peso') || x.data.tipo === 'meta_peso').length;
      const deCofre = itens.filter((x) => x.data.tipo === 'meta_guardar').length;
      document.getElementById('statTotal').textContent = itens.length;
      document.getElementById('statPeso').textContent = dePeso;
      document.getElementById('statCofre').textContent = deCofre;

      if (!itens.length) {
        lista.innerHTML = '<div class="statement-empty">Você ainda não tem medalhas. Registre seu peso e crie metas na página Saúde, ou um cofrinho no Financeiro!</div>';
        return;
      }

      lista.innerHTML = itens.map((c) => {
        const d = c.data;
        const icone = ICONES[d.icone] || ICONES.trofeu;
        return `
          <div class="medalha-card" data-tipo="${d.tipo}">
            <div class="medalha-icon"><svg viewBox="0 0 24 24">${icone}</svg></div>
            <div class="medalha-titulo">${d.titulo}</div>
            <div class="medalha-desc">${d.descricao}</div>
            <div class="medalha-data">${dataBR(d.dataConquista)}</div>
          </div>`;
      }).join('');
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        render(await api('/api/conquistas'));
      } catch (err) {
        console.error('Erro ao carregar conquistas:', err);
        document.getElementById('listaConquistas').innerHTML =
          '<div class="statement-empty">Não foi possível carregar as conquistas.</div>';
      }
    });
  </script>
  <script src="js/mobile-nav.js?v=13"></script>
</body>
</html>
