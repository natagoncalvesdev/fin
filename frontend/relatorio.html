<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório - Controle Financeiro</title>
  <link rel="icon" href="img/icone.ico" type="image/x-icon" />
  <link rel="stylesheet" href="sidebar.css?v=6">
  <link rel="stylesheet" href="css/theme.css?v=6">
  <link rel="stylesheet" href="css/mobile-shell.css?v=7">
  <script src="js/fin-run-once.js"></script>
  <script src="js/fin-config.js?v=1"></script>
  <script src="js/fin-sdk.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="sidebar.js?v=6"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      display: flex;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 40px;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1180px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .categoria-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: var(--slate-100);
    }

    .categoria-item span {
      font-weight: 500;
      font-size: 14.5px;
    }

    .total-categoria {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 12px;
    }

    .categoria-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
    }

    .categoria-card {
      flex: 1;
      min-width: 250px;
      max-width: 320px;
      background: var(--bg-section);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .categoria-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .categoria-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .categoria-card-nome {
      font-size: 16px;
      font-weight: 600;
    }

    .categoria-card-valor {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .categoria-card-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .categoria-card-item-nome {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .categoria-card-item-valor {
      font-weight: 600;
      color: var(--text-primary);
      margin-left: 12px;
    }

    .categoria-card-ver-mais {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 600;
    }

    #modalItensCategoria .modal-content {
      max-width: 560px;
    }

    .modal-item-linha {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-item-linha:last-child { border-bottom: none; }

    .modal-item-descricao {
      flex: 1;
      font-weight: 500;
      font-size: 14.5px;
    }

    .modal-item-mes {
      color: var(--text-secondary);
      font-size: 11.5px;
      margin-left: 8px;
      padding: 2px 8px;
      background: var(--accent-soft);
      border-radius: 999px;
      font-weight: 600;
    }

    .modal-item-valor {
      font-weight: 700;
      font-size: 14.5px;
    }

    .chart-container {
      margin-top: 8px;
      height: 380px;
      position: relative;
    }

    .chart-legend-mobile {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }

    .chart-legend-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .chart-legend-info {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chart-legend-name { font-weight: 600; font-size: 14px; }
    .chart-legend-value { font-size: 13px; color: var(--text-secondary); }
    .chart-legend-percent {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    @media (max-width: 768px) {
      .chart-container { height: 300px; }
      .chart-legend-mobile { display: block; }
      .categoria-card { flex: none; width: 100%; max-width: 100%; min-width: auto; }
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="header">
      <div class="page-header">
        <h1>Relatório</h1>
        <p>Acompanhe seus gastos por categoria e gere relatórios do período.</p>
      </div>
      <div class="header-actions">
        <button class="btn-cancel" onclick="abrirModalCategorias()">Categorias</button>
        <button class="btn-add" onclick="irParaResumoAnual()">Resumo Anual</button>
      </div>
    </div>

    <!-- Modal de Categorias -->
    <div id="modalCategorias" class="modal-overlay">
      <div class="modal-content">
        <h3>Administrar Categorias</h3>
        <div class="form-row">
          <input type="text" id="novaCategoria" placeholder="Nome da categoria" />
          <button class="btn-add" onclick="finRunOnce(event, () => adicionarCategoria())">Adicionar Categoria</button>
        </div>
        <div id="listaCategorias" style="margin-top: 16px;">
          <!-- Categorias serão listadas aqui -->
        </div>
        <div style="margin-top: 20px; text-align: center;">
          <button class="btn-cancel" onclick="fecharModalCategorias()">Fechar</button>
        </div>
      </div>
    </div>

    <div class="section-card">
      <h3 class="section-card-title">Filtros</h3>
      <div class="form-row" style="align-items:center;">
        <select id="selectAno">
          <!-- Anos serão populados via JS -->
        </select>
        <select id="selectMes">
          <option value="">Todos os meses</option>
          <!-- Meses serão populados via JS -->
        </select>
        <select id="selectCategoria">
          <option value="">Todas as categorias</option>
          <!-- Categorias serão populadas via JS -->
        </select>
        <button class="btn-cancel" onclick="carregarRelatorios()">Filtrar</button>
        <button class="btn-add" id="btnGerarRelatorio" onclick="finRunOnce(event, () => gerarRelatorio())">Gerar Relatório</button>
      </div>
    </div>

    <div class="section-card">
      <h3 class="section-card-title">Gráfico por Categoria</h3>
      <div class="chart-container">
        <canvas id="graficoCategorias"></canvas>
      </div>
      <div id="chartLegendMobile" class="chart-legend-mobile">
        <!-- Legenda será populada via JS no mobile -->
      </div>
    </div>

    <div class="section-card">
      <h3 class="section-card-title">Relatórios</h3>
      <div id="relatorios">
        <p style="color: var(--text-secondary); text-align: center; padding: 40px;">
          Selecione os filtros acima e clique em "Filtrar" para visualizar os relatórios por categoria.
        </p>
      </div>
    </div>

    <!-- Modal para exibir itens da categoria -->
    <div id="modalItensCategoria" class="modal-overlay">
      <div class="modal-content">
        <h3 id="modalCategoriaTitulo">Itens da Categoria</h3>
        <div id="modalCategoriaTotal" class="total-categoria" style="margin-bottom: 16px;"></div>
        <div id="modalCategoriaItens" class="modal-itens-lista">
          <!-- Itens serão populados via JS -->
        </div>
        <div id="modalCategoriaSemCategoria" style="display: none;">
          <div class="form-row" style="margin-top: 16px;">
            <select id="modalCategoriaSelect" style="flex: 1;">
              <option value="">Selecione uma categoria</option>
            </select>
            <button class="btn-add" onclick="finRunOnce(event, () => salvarCategoriaModal())">Adicionar</button>
          </div>
        </div>
        <div style="margin-top: 20px; text-align: center;">
          <button class="btn-cancel" onclick="fecharModalItensCategoria()">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();
    const TOKEN_KEY = 'fin_token';
    const API_BASE = window.FIN_API_BASE || '';

    const MESES = [
      "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
      "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
    ];
    const ANO_BASE = 2025;
    const ANO_LIMITE = ANO_BASE + 10;

    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const formatar = valor => moeda.format(Number(valor) || 0);

    let currentUser = null;
    let categoriasCache = [];
    let graficoCategorias = null;

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileNavMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function abrirModalCategorias() {
      document.getElementById('modalCategorias').classList.add('visible');
      renderizarListaCategorias();
    }

    function fecharModalCategorias() {
      document.getElementById('modalCategorias').classList.remove('visible');
    }

    function irParaResumoAnual() {
      const selectAno = document.getElementById("selectAno");
      const ano = selectAno.value || String(new Date().getFullYear());
      window.location.href = `resumo.html?ano=${encodeURIComponent(ano)}`;
    }

    function popularListaAnos() {
      const selectAno = document.getElementById("selectAno");
      selectAno.innerHTML = "";
      for (let ano = ANO_BASE; ano <= ANO_LIMITE; ano++) {
        const option = document.createElement("option");
        option.value = String(ano);
        option.textContent = String(ano);
        selectAno.appendChild(option);
      }
      const hoje = new Date();
      let anoCorrente = hoje.getFullYear();
      if (anoCorrente < ANO_BASE || anoCorrente > ANO_LIMITE) {
        anoCorrente = ANO_BASE;
      }
      selectAno.value = String(anoCorrente);
    }

    function popularListaMeses() {
      const selectMes = document.getElementById("selectMes");
      selectMes.innerHTML = '<option value="">Todos os meses</option>';
      MESES.forEach(mes => {
        const option = document.createElement("option");
        option.value = mes;
        option.textContent = mes;
        selectMes.appendChild(option);
      });
      // Define o mês atual como padrão
      const hoje = new Date();
      const mesAtual = MESES[hoje.getMonth()];
      selectMes.value = mesAtual;
    }

    async function carregarCategorias() {
      if (!currentUser) return;
      try {
        const categoriasRef = db.collection('users').doc(currentUser.uid).collection('categorias');
        const snapshot = await categoriasRef.get();
        categoriasCache = [];
        snapshot.forEach(doc => {
          categoriasCache.push({ id: doc.id, nome: doc.data().nome });
        });
        categoriasCache.sort((a, b) => a.nome.localeCompare(b.nome));
        renderizarListaCategorias();
        popularSelectCategoria();
      } catch (error) {
        console.error("Erro ao carregar categorias:", error);
      }
    }

    function renderizarListaCategorias() {
      const lista = document.getElementById("listaCategorias");
      lista.innerHTML = "";
      if (categoriasCache.length === 0) {
        lista.innerHTML = '<p style="color: var(--text-secondary);">Nenhuma categoria cadastrada.</p>';
        return;
      }
      categoriasCache.forEach(cat => {
        const div = document.createElement("div");
        div.className = "categoria-item";
        div.innerHTML = `
          <span>${cat.nome}</span>
          <button class="btn-inline fin-btn-danger" onclick="finRunOnce(event, () => removerCategoria('${cat.id}'))">Remover</button>
        `;
        lista.appendChild(div);
      });
    }

    function popularSelectCategoria() {
      const select = document.getElementById("selectCategoria");
      const valorAtual = select.value;
      select.innerHTML = '<option value="">Todas as categorias</option><option value="Sem categoria">Sem categoria</option>';
      categoriasCache.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat.nome;
        option.textContent = cat.nome;
        select.appendChild(option);
      });
      if (valorAtual) {
        select.value = valorAtual;
      }
    }

    async function adicionarCategoria() {
      if (!currentUser) return;
      const input = document.getElementById("novaCategoria");
      const nome = input.value.trim();
      if (!nome) {
        return alert("Por favor, digite o nome da categoria.");
      }
      if (categoriasCache.some(cat => cat.nome.toLowerCase() === nome.toLowerCase())) {
        return alert("Esta categoria já existe.");
      }
      try {
        const categoriasRef = db.collection('users').doc(currentUser.uid).collection('categorias');
        await categoriasRef.add({ nome: nome });
        input.value = "";
        await carregarCategorias();
        renderizarListaCategorias();
      } catch (error) {
        console.error("Erro ao adicionar categoria:", error);
        alert("Erro ao adicionar categoria. Tente novamente.");
      }
    }

    async function removerCategoria(categoriaId) {
      if (!currentUser) return;
      if (!confirm("Tem certeza que deseja remover esta categoria?")) {
        return;
      }
      try {
        const categoriaRef = db.collection('users').doc(currentUser.uid).collection('categorias').doc(categoriaId);
        await categoriaRef.delete();
        await carregarCategorias();
        renderizarListaCategorias();
      } catch (error) {
        console.error("Erro ao remover categoria:", error);
        alert("Erro ao remover categoria. Tente novamente.");
      }
    }

    async function carregarPerfilUsuario() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return null;
      const response = await fetch(`${API_BASE}/api/auth/me`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!response.ok) return null;
      return response.json();
    }

    async function gerarRelatorio() {
      if (!currentUser) return;

      const selectAno = document.getElementById("selectAno");
      const selectMes = document.getElementById("selectMes");
      const ano = Number(selectAno.value);
      const mes = selectMes.value;

      if (!ano) {
        return alert("Por favor, selecione um ano.");
      }
      if (!mes) {
        return alert("Selecione um mês específico para gerar o relatório.");
      }

      const perfil = await carregarPerfilUsuario();
      if (!perfil?.id_telegram) {
        window.location.href = 'configuracoes.html?focus=id-telegram';
        return;
      }

      try {
        // O backend monta a mensagem e envia pelo n8n — o navegador nunca
        // fala direto com o webhook (que não tem autenticação própria e
        // aceitaria chat_id/mensagem de qualquer um que descobrisse a URL).
        await window.finApi.request('/api/relatorios/gerar', {
          method: 'POST',
          body: JSON.stringify({ ano, mes }),
        });
        alert('Relatório enviado com sucesso.');
      } catch (error) {
        console.error("Erro ao gerar relatório:", error);
        alert(error.message || 'Erro ao gerar relatório. Tente novamente.');
      }
    }

    async function carregarRelatorios() {
      if (!currentUser) return;
      const selectAno = document.getElementById("selectAno");
      const selectMes = document.getElementById("selectMes");
      const selectCategoria = document.getElementById("selectCategoria");
      const ano = selectAno.value;
      const mes = selectMes.value;
      const categoriaFiltro = selectCategoria.value;

      if (!ano) {
        return alert("Por favor, selecione um ano.");
      }

      const relatoriosDiv = document.getElementById("relatorios");
      relatoriosDiv.innerHTML = "<p>Carregando...</p>";

      try {
        const relatoriosPorCategoria = {};
        const totaisMensaisCategoriaFiltrada = {};
        const mesesParaProcessar = mes ? [mes] : MESES;

        // Ano inteiro numa única requisição (antes eram 12 chamadas em série,
        // ~15s; agora ~1s).
        const resumo = await window.finApi.request(`/api/financeiro/anos/${ano}/resumo`);
        const mesesDoAno = resumo.meses || {};

        for (const mesNome of mesesParaProcessar) {
          if (!totaisMensaisCategoriaFiltrada[mesNome]) {
            totaisMensaisCategoriaFiltrada[mesNome] = 0;
          }
          const data = mesesDoAno[mesNome];
          if (!data) continue;

          const tipos = ['contas', 'cartao', 'reservado', 'debito'];

          tipos.forEach(tipo => {
            const itens = data[tipo] || [];
            itens.forEach((item, index) => {
              const categoria = item.categoria || "Sem categoria";
              if (categoriaFiltro && categoria !== categoriaFiltro) return;

              if (!relatoriosPorCategoria[categoria]) {
                relatoriosPorCategoria[categoria] = {
                  total: 0,
                  itens: [],
                  mes: mesNome
                };
              }
              const valorItem = Number(item.valor || 0);
              relatoriosPorCategoria[categoria].total += valorItem;
              if (categoriaFiltro && categoria === categoriaFiltro) {
                totaisMensaisCategoriaFiltrada[mesNome] += valorItem;
              }
              relatoriosPorCategoria[categoria].itens.push({
                ...item,
                tipo: tipo,
                mes: mesNome,
                ano: ano,
                index: index // Índice do item no array
              });
            });
          });
        }

        renderizarRelatorios(relatoriosPorCategoria, mes, categoriaFiltro);
        atualizarGrafico(relatoriosPorCategoria, {
          ano,
          mesSelecionado: mes,
          categoriaSelecionada: categoriaFiltro,
          totaisMensaisCategoriaFiltrada
        });
      } catch (error) {
        console.error("Erro ao carregar relatórios:", error);
        relatoriosDiv.innerHTML = "<p style='color: var(--accent-3);'>Erro ao carregar relatórios.</p>";
      }
    }

    function atualizarGrafico(relatoriosPorCategoria, contexto = {}) {
      const ctx = document.getElementById('graficoCategorias');
      if (!ctx) return;

      // Destrói o gráfico anterior se existir
      if (graficoCategorias) {
        graficoCategorias.destroy();
      }

      const categorias = Object.keys(relatoriosPorCategoria).filter(cat => cat !== "Sem categoria");
      const valores = categorias.map(cat => relatoriosPorCategoria[cat].total);
      const mostrarPorMesDaCategoria = !contexto.mesSelecionado && !!contexto.categoriaSelecionada;

      let labelsGrafico = categorias;
      let valoresGrafico = valores;
      let tituloDataset = 'Valor Gasto';

      if (mostrarPorMesDaCategoria) {
        labelsGrafico = MESES;
        valoresGrafico = MESES.map(mesNome => Number(contexto.totaisMensaisCategoriaFiltrada?.[mesNome] || 0));
        tituloDataset = `Valor Gasto - ${contexto.categoriaSelecionada}`;
      }

      if (labelsGrafico.length === 0) {
        // Se não houver categorias, mostra um gráfico vazio
        graficoCategorias = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: [],
            datasets: []
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
        return;
      }

      // Detecta se é mobile
      const isMobile = window.innerWidth <= 768;
      const tipoGrafico = isMobile ? 'doughnut' : 'bar';

      // Paleta ancorada no azul da identidade do app (mesma família de cores
      // usada no gráfico de categorias do Resumo do mês).
      const coresBase = [
        [37, 99, 235], [14, 165, 233], [124, 58, 237], [245, 158, 11],
        [239, 68, 68], [100, 116, 139], [16, 185, 129], [236, 72, 153],
        [99, 102, 241], [20, 184, 166], [249, 115, 22], [139, 92, 246],
      ].map(([r, g, b]) => ({ bg: `rgba(${r}, ${g}, ${b}, 0.9)`, border: `rgba(${r}, ${g}, ${b}, 1)` }));

      const coresUsadas = coresBase.slice(0, labelsGrafico.length);
      const backgrounds = coresUsadas.map(c => c.bg);
      const borders = coresUsadas.map(c => c.border);

      // Calcula percentuais para exibir nos tooltips
      const total = valoresGrafico.reduce((acc, val) => acc + val, 0);

      // Para desktop, cria gradientes mais bonitos
      let backgroundsFinal = backgrounds;
      let bordersFinal = borders;
      
      if (!isMobile && tipoGrafico === 'bar') {
        const ctxCanvas = ctx.getContext('2d');
        backgroundsFinal = backgrounds.map((bg, index) => {
          const gradient = ctxCanvas.createLinearGradient(0, 0, 0, 400);
          const baseColor = bg.replace('rgba(', '').replace(')', '').split(',');
          const r = baseColor[0];
          const g = baseColor[1];
          const b = baseColor[2];
          gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.9)`);
          gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0.6)`);
          return gradient;
        });
        bordersFinal = borders.map(border => border.replace('0.8', '1'));
      }

      const configBase = {
        type: tipoGrafico,
        data: {
          labels: labelsGrafico,
          datasets: [{
            label: tituloDataset,
            data: valoresGrafico,
            backgroundColor: backgroundsFinal,
            borderColor: bordersFinal,
            borderWidth: isMobile ? 2 : 3,
            borderRadius: isMobile ? 4 : 8,
            borderSkipped: false,
            barThickness: isMobile ? 'flex' : 50,
            maxBarThickness: isMobile ? 40 : 60,
            barPercentage: isMobile ? 0.7 : 0.8,
            categoryPercentage: isMobile ? 0.8 : 0.9
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: isMobile ? 5 : {
              top: 20,
              bottom: 20,
              left: 20,
              right: 20
            }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: isMobile ? 'rgba(0, 0, 0, 0.8)' : 'rgba(0, 0, 0, 0.9)',
              padding: isMobile ? 10 : 16,
              titleFont: {
                size: isMobile ? 12 : 16,
                weight: 'bold',
                family: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
              },
              bodyFont: {
                size: isMobile ? 11 : 14,
                weight: '500',
                family: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
              },
              borderColor: 'rgba(255, 255, 255, 0.2)',
              borderWidth: isMobile ? 1 : 2,
              cornerRadius: isMobile ? 8 : 12,
              displayColors: true,
              boxPadding: isMobile ? 6 : 8,
              titleSpacing: isMobile ? 4 : 6,
              bodySpacing: isMobile ? 4 : 6,
              titleAlign: 'center',
              bodyAlign: 'center',
              callbacks: {
                label: function(context) {
                  let value;
                  if (tipoGrafico === 'doughnut') {
                    value = context.parsed;
                  } else {
                    value = context.parsed.y;
                  }
                  const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                  if (mostrarPorMesDaCategoria) {
                    return `${formatar(value)} (${percent}% do período)`;
                  }
                  return `${formatar(value)} (${percent}%)`;
                },
                afterLabel: function(context) {
                  if (mostrarPorMesDaCategoria) {
                    return `Mês: ${context.label}`;
                  }
                  return `Categoria: ${context.label}`;
                }
              }
            }
          },
          ...(tipoGrafico === 'bar' ? {
            scales: {
              x: {
                grid: {
                  display: false,
                  drawBorder: false
                },
                ticks: {
                  font: {
                    size: isMobile ? 9 : 13,
                    weight: '600',
                    family: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
                  },
                  color: 'rgba(0, 0, 0, 0.8)',
                  maxRotation: isMobile ? 45 : 0,
                  minRotation: isMobile ? 45 : 0,
                  padding: isMobile ? 8 : 12
                }
              },
              y: {
                beginAtZero: true,
                grid: {
                  color: isMobile ? 'rgba(0, 0, 0, 0.05)' : 'rgba(0, 0, 0, 0.08)',
                  lineWidth: isMobile ? 1 : 1.5,
                  drawBorder: false
                },
                ticks: {
                  callback: function(value) {
                    return formatar(value);
                  },
                  font: {
                    size: isMobile ? 9 : 12,
                    weight: '600',
                    family: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
                  },
                  color: 'rgba(0, 0, 0, 0.7)',
                  padding: isMobile ? 4 : 12
                }
              }
            }
          } : {
            // Opções específicas para doughnut (mobile)
            cutout: '60%'
          }),
          animation: {
            duration: isMobile ? 1000 : 1500,
            easing: isMobile ? 'easeOutQuart' : 'easeOutCubic',
            delay: (context) => {
              if (context.type === 'data' && context.mode === 'default') {
                return context.dataIndex * 50;
              }
              return 0;
            }
          },
          interaction: {
            intersect: false,
            mode: 'index'
          },
          onHover: (event, activeElements) => {
            event.native.target.style.cursor = activeElements.length > 0 ? 'pointer' : 'default';
          }
        }
      };

      graficoCategorias = new Chart(ctx, configBase);

      // Se for mobile, adiciona a legenda abaixo do gráfico
      if (isMobile) {
        atualizarLegendaMobile(labelsGrafico, valoresGrafico, backgrounds, total);
      } else {
        document.getElementById('chartLegendMobile').innerHTML = '';
      }
    }

    function atualizarLegendaMobile(categorias, valores, cores, total) {
      const legendDiv = document.getElementById('chartLegendMobile');
      if (!legendDiv) return;

      legendDiv.innerHTML = '';

      // Cria array com os dados e calcula percentuais
      const dadosOrdenados = categorias.map((categoria, index) => {
        const valor = valores[index];
        const cor = cores[index];
        const percent = total > 0 ? ((valor / total) * 100) : 0;
        return {
          categoria,
          valor,
          cor,
          percent: Number(percent)
        };
      });

      // Ordena por percentual em ordem decrescente
      dadosOrdenados.sort((a, b) => b.percent - a.percent);

      // Renderiza os itens ordenados
      dadosOrdenados.forEach(item => {
        const percentFormatado = item.percent.toFixed(1);
        const itemDiv = document.createElement('div');
        itemDiv.className = 'chart-legend-item';
        itemDiv.innerHTML = `
          <div class="chart-legend-color" style="background-color: ${item.cor};"></div>
          <div class="chart-legend-info">
            <span class="chart-legend-name">${item.categoria}</span>
            <div style="display: flex; gap: 12px; align-items: center;">
              <span class="chart-legend-value">${formatar(item.valor)}</span>
              <span class="chart-legend-percent">${percentFormatado}%</span>
            </div>
          </div>
        `;
        legendDiv.appendChild(itemDiv);
      });
    }

    // Armazena os dados completos para o modal
    let dadosCompletosRelatorios = {};

    function renderizarRelatorios(relatoriosPorCategoria, mesSelecionado = '', categoriaFiltro = '') {
      const relatoriosDiv = document.getElementById("relatorios");
      relatoriosDiv.innerHTML = "";

      const categorias = Object.keys(relatoriosPorCategoria).sort();
      if (categorias.length === 0) {
        relatoriosDiv.innerHTML = "<p style='color: var(--text-secondary);'>Nenhum dado encontrado para os filtros selecionados.</p>";
        return;
      }

      // Armazena os dados completos para usar no modal
      dadosCompletosRelatorios = relatoriosPorCategoria;

      // Verifica se "Todos os meses" está selecionado (valor vazio)
      const mostrarMes = !mesSelecionado || mesSelecionado === '';
      const dividirCardsPorMes = mostrarMes && !!categoriaFiltro;

      let totalGeral = 0;

      // Container para os cards
      const cardsContainer = document.createElement("div");
      cardsContainer.className = "categoria-cards";

      function anexarCardCategoria(categoria, dados, opcoes = {}) {
        const {
          rotuloPrincipal = categoria,
          mostrarMesNoPreview = mostrarMes,
          tituloModalMes = null
        } = opcoes;

        totalGeral += dados.total;

        const ehSemCategoria = categoria === "Sem categoria";

        const itensPreview = dados.itens.slice(0, 3);
        const totalItens = dados.itens.length;
        const temMaisItens = totalItens > 3;

        const card = document.createElement("div");
        card.className = "categoria-card";
        const mostrarMesNoModal = tituloModalMes ? false : mostrarMes;
        card.onclick = () => abrirModalItensCategoria(categoria, dados, mostrarMesNoModal, ehSemCategoria, tituloModalMes);

        let itensHTML = '';
        if (itensPreview.length > 0) {
          itensHTML = itensPreview.map(item => {
            const descricao = item.nome || '-';
            const descricaoTruncada = descricao.length > 25 ? descricao.substring(0, 25) + '...' : descricao;
            const mesAbreviado = mostrarMesNoPreview && item.mes ? item.mes.substring(0, 3) : '';
            return `
              <div class="categoria-card-item">
                <span class="categoria-card-item-nome">${descricaoTruncada}${mesAbreviado ? ` <span style="color: var(--text-secondary); font-size: 11px;">${mesAbreviado}</span>` : ''}</span>
                <span class="categoria-card-item-valor">${formatar(item.valor || 0)}</span>
              </div>
            `;
          }).join('');
        } else {
          itensHTML = '<div class="categoria-card-item" style="color: var(--text-secondary);">Nenhum item</div>';
        }

        card.innerHTML = `
          <div class="categoria-card-header">
            <div class="categoria-card-nome">${rotuloPrincipal}</div>
            <div class="categoria-card-valor">${formatar(dados.total)}</div>
          </div>
          <div class="categoria-card-itens">
            ${itensHTML}
            ${temMaisItens ? `<div class="categoria-card-ver-mais">+${totalItens - 3} mais itens</div>` : ''}
          </div>
        `;

        cardsContainer.appendChild(card);
      }

      if (dividirCardsPorMes && categorias.length === 1) {
        const categoria = categorias[0];
        const dados = relatoriosPorCategoria[categoria];
        totalGeral = 0;
        MESES.forEach(mesNome => {
          const itensMes = dados.itens.filter(item => item.mes === mesNome);
          if (!itensMes.length) return;
          const totalMes = itensMes.reduce((s, i) => s + Number(i.valor || 0), 0);
          const dadosMes = { total: totalMes, itens: itensMes };
          const rotulo = `${mesNome}<span style="display:block;font-size:14px;font-weight:500;color:var(--text-secondary);margin-top:4px;">${categoria}</span>`;
          anexarCardCategoria(categoria, dadosMes, {
            rotuloPrincipal: rotulo,
            mostrarMesNoPreview: false,
            tituloModalMes: mesNome
          });
        });
      } else {
        categorias.forEach(categoria => {
          const dados = relatoriosPorCategoria[categoria];
          anexarCardCategoria(categoria, dados);
        });
      }

      relatoriosDiv.appendChild(cardsContainer);

      const totalDiv = document.createElement("div");
      totalDiv.style.cssText = "margin-top: 32px; padding: 24px; background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-blue-hover) 100%); color: #fff; border-radius: 16px; font-size: 24px; font-weight: 700; text-align: center; box-shadow: var(--shadow-lg); letter-spacing: -0.02em;";
      totalDiv.textContent = `Total Geral: ${formatar(totalGeral)}`;
      relatoriosDiv.appendChild(totalDiv);
    }

    function abrirModalItensCategoria(categoria, dados, mostrarMes, ehSemCategoria, mesNoTitulo = null) {
      const modal = document.getElementById('modalItensCategoria');
      const titulo = document.getElementById('modalCategoriaTitulo');
      const total = document.getElementById('modalCategoriaTotal');
      const itensDiv = document.getElementById('modalCategoriaItens');
      const semCategoriaDiv = document.getElementById('modalCategoriaSemCategoria');

      titulo.textContent = mesNoTitulo ? `${categoria} — ${mesNoTitulo}` : categoria;
      total.textContent = `Total: ${formatar(dados.total)}`;

      itensDiv.innerHTML = '';

      if (dados.itens.length === 0) {
        itensDiv.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Nenhum item encontrado.</p>';
      } else {
        dados.itens.forEach((item, index) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "modal-item-linha";

          const descricao = item.nome || '-';
          const mesAbreviado = mostrarMes && item.mes ? item.mes.substring(0, 3) : '';
          const mesSpan = mesAbreviado ? `<span class="modal-item-mes">${mesAbreviado}</span>` : '';

          itemDiv.innerHTML = `
            <div class="modal-item-descricao">${descricao}${mesSpan}</div>
            <div class="modal-item-valor">${formatar(item.valor || 0)}</div>
          `;

          itensDiv.appendChild(itemDiv);
        });
      }

      // Se for categoria "Sem categoria", mostra o formulário para adicionar categoria
      if (ehSemCategoria) {
        semCategoriaDiv.style.display = 'block';
        const select = document.getElementById('modalCategoriaSelect');
        select.innerHTML = '<option value="">Selecione uma categoria</option>';
        categoriasCache.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat.nome;
          option.textContent = cat.nome;
          select.appendChild(option);
        });
        // Armazena os itens sem categoria para poder salvar depois
        window.itensSemCategoriaModal = dados.itens;
      } else {
        semCategoriaDiv.style.display = 'none';
      }

      modal.classList.add('visible');

      // Adiciona listener para fechar ao clicar fora do modal
      modal.onclick = function(event) {
        // Se o clique foi diretamente no overlay (não no conteúdo do modal)
        if (event.target === modal) {
          fecharModalItensCategoria();
        }
      };
    }

    function fecharModalItensCategoria() {
      const modal = document.getElementById('modalItensCategoria');
      modal.classList.remove('visible');
      // Remove o listener ao fechar
      modal.onclick = null;
    }

    // Cada tipo de lançamento tem seu próprio endpoint granular — a mesma
    // rota usada pelas páginas de Contas/Cartões/Reservados. Atualizar por
    // uuid (item.id) em vez de índice de array elimina a race condition que
    // existia aqui antes (ler o mês inteiro, mudar por posição no array,
    // regravar o mês inteiro — se o array mudasse nesse meio-tempo, a
    // categoria podia ser aplicada ao lançamento errado).
    const ENDPOINT_POR_TIPO = {
      contas: '/api/financeiro/contas',
      debito: '/api/financeiro/debitos',
      reservado: '/api/financeiro/reservados',
      cartao: '/api/financeiro/compras-cartao',
    };

    async function salvarCategoriaModal() {
      const select = document.getElementById('modalCategoriaSelect');
      const categoria = select.value.trim();
      if (!categoria) {
        return alert("Por favor, selecione uma categoria.");
      }

      const itens = window.itensSemCategoriaModal || [];
      if (itens.length === 0) {
        return alert("Nenhum item para atualizar.");
      }

      try {
        const resultados = await Promise.allSettled(
          itens.map((item) => {
            const base = ENDPOINT_POR_TIPO[item.tipo];
            if (!base || !item.id) return Promise.reject(new Error('Item sem id.'));
            return window.finApi.request(`${base}/${item.id}`, {
              method: 'PUT',
              body: JSON.stringify({ categoria }),
            });
          })
        );
        const falhas = resultados.filter((r) => r.status === 'rejected');
        if (falhas.length) {
          console.error('Falhas ao salvar categoria:', falhas);
          alert(`${itens.length - falhas.length} de ${itens.length} item(ns) atualizado(s). Alguns falharam — tente novamente.`);
        } else {
          alert(`${itens.length} item(ns) atualizado(s) com sucesso!`);
        }
        fecharModalItensCategoria();
        await carregarRelatorios();
      } catch (error) {
        console.error("Erro ao salvar categorias:", error);
        alert("Erro ao salvar categorias. Tente novamente.");
      }
    }
    // removido: salvarTodasCategorias() era código morto — procurava selects
    // `categoriaSelect_*` que não existem em lugar nenhum do HTML; o botão
    // "Salvar Alterações de Categorias" que a chamava também foi removido.
    // O fluxo real de categorização é o modal por card, acima.

    // Fechar modal ao clicar fora
    document.addEventListener('click', (e) => {
      const modal = document.getElementById('modalCategorias');
      if (e.target === modal) {
        fecharModalCategorias();
      }
    });

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        popularListaAnos();
        popularListaMeses();
        await carregarCategorias();
        // Carrega automaticamente o relatório do mês atual
        await carregarRelatorios();
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
  <script src="js/mobile-nav.js?v=10"></script>
</body>
</html>
