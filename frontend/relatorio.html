<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório - Controle Financeiro</title>
  <link rel="icon" href="img/icone.ico" type="image/x-icon" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Fin" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fin" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/img/pwa/apple-touch-icon.png" />
  <script src="/js/fin-pwa.js" defer></script>
  <link rel="stylesheet" href="sidebar.css?v=11">
  <link rel="stylesheet" href="css/theme.css?v=11">
  <link rel="stylesheet" href="css/mobile-shell.css?v=9">
  <script src="js/fin-run-once.js"></script>
  <script src="js/fin-config.js?v=1"></script>
  <script src="js/fin-sdk.js?v=7"></script>
  <script src="js/fin-financeiro-shared.js?v=8"></script>
  <script src="sidebar.js?v=9"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      display: flex;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 28px 36px 48px;
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1200px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .rl-filtros {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding: 16px 18px;
    }

    .rl-filtros label { display: grid; gap: 6px; }
    .rl-filtros span { font-size: 12px; font-weight: 500; color: var(--text-secondary); }

    .rl-filtros select {
      width: 100%;
      font: 500 13px var(--font-family);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e8eaee;
      background: #fff;
      color: var(--text-primary);
      cursor: pointer;
    }

    .rl-filtros select:hover { border-color: #cbd5e1; }
    .rl-filtros select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .rl-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .rl-kpi small { font-size: 12px; color: var(--text-secondary); }
    .rl-kpi-valor { font-size: 22px; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .rl-kpi-texto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .rl-dica { font-weight: 500; font-size: 12px; color: var(--text-secondary); margin-left: 6px; }

    .rl-ranking { display: grid; gap: 4px; }

    .rl-barra-linha {
      display: grid;
      grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 8px 6px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      width: 100%;
    }

    .rl-barra-linha:hover { background: #f8fafc; }
    .rl-barra-linha:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .rl-barra-linha[disabled] { cursor: default; }
    .rl-barra-linha[disabled]:hover { background: transparent; }

    .rl-barra-nome {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
    }

    .rl-barra-nome span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rl-barra-nome svg { width: 16px; height: 16px; flex: none; color: var(--text-secondary); }

    .rl-trilho { height: 10px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
    .rl-trilho div { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

    .rl-barra-valor { font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .rl-barra-valor small { font-weight: 500; color: var(--text-secondary); margin-left: 6px; }

    .rl-vazio { padding: 28px 0; text-align: center; color: var(--text-secondary); font-size: 13px; }

    .rl-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .rl-modal-head h3 { margin: 0; }

    @media (max-width: 860px) {
      .rl-filtros,
      .rl-kpis { grid-template-columns: 1fr; }
      .rl-barra-linha { grid-template-columns: minmax(0, 1fr) auto; }
      .rl-barra-linha .rl-trilho { grid-column: 1 / -1; grid-row: 2; }
    }

    @media (max-width: 768px), (max-height: 500px) {
      .rl-filtros { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px; }
      .rl-filtros label:last-child { grid-column: 1 / -1; }
      .rl-filtros select { min-height: 42px; }
      .rl-kpis { gap: 10px; }
      .rl-kpi {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: baseline;
        gap: 2px 12px;
        padding: 14px 16px;
      }
      .rl-kpi-valor { font-size: 17px; margin: 0; text-align: right; }
      .rl-kpi small:last-child { grid-column: 1 / -1; }
      .rl-barra-linha { padding: 10px 4px; gap: 6px 12px; }
      .rl-dica { display: block; margin: 4px 0 0; }
      .content .categoria-cards { grid-template-columns: 1fr; gap: 10px; }
      .content .categoria-card { padding: 16px; }
    }

    .modal-categorias {
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow: auto;
    }

    .icone-rotulo {
      margin: 14px 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .icone-grade {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .icone-opcao,
    .cat-icone {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-primary);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      font: 600 16px var(--font-family);
    }

    .icone-opcao.on,
    .cat-icone.on {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .icone-editor { width: 100%; }

    .categoria-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: var(--slate-100);
    }

    .categoria-item span {
      font-weight: 500;
      font-size: 14.5px;
    }

    .total-categoria {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin: 0 0 14px;
    }

    .total-categoria b {
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 700;
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }

    .categoria-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .categoria-card {
      background: var(--bg-section);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid #e8eaee;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .categoria-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 14px -8px rgba(15, 23, 42, 0.18);
    }

    .categoria-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .categoria-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef0f3;
    }

    .categoria-card-nome {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      min-width: 0;
    }

    .categoria-card-nome svg { width: 18px; height: 18px; flex: none; color: var(--text-secondary); }

    .categoria-card-valor {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .categoria-card-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .categoria-card-item-nome {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .categoria-card-item-valor {
      font-weight: 600;
      color: var(--text-primary);
      margin-left: 12px;
    }

    .categoria-card-ver-mais {
      margin-top: 8px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }

    #modalItensCategoria .modal-content {
      max-width: 560px;
    }

    .modal-itens-lista { max-height: min(55vh, 460px); overflow-y: auto; }

    .modal-item-linha {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 11px 2px;
      border-bottom: 1px solid #eef0f3;
    }

    .modal-item-linha:last-child { border-bottom: none; }

    .modal-item-descricao {
      flex: 1;
      min-width: 0;
      font-weight: 500;
      font-size: 14px;
    }

    .modal-item-descricao small {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .modal-item-mes {
      color: var(--text-secondary);
      font-size: 11px;
      margin-left: 8px;
      padding: 2px 8px;
      background: #f1f5f9;
      border-radius: 999px;
      font-weight: 600;
    }

    .modal-item-valor {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="page-header-row">
      <div class="page-header">
        <h1>Relatórios</h1>
        <p id="rlSub">Gastos por categoria no período escolhido</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-cancel" onclick="abrirModalCategorias()">Categorias</button>
        <button type="button" class="btn-add" onclick="irParaResumoAnual()">Resumo anual</button>
      </div>
    </div>

    <section class="section-card rl-filtros" aria-label="Filtros">
      <label><span>Ano</span><select id="selectAno"></select></label>
      <label><span>Mês</span><select id="selectMes"><option value="">Todos os meses</option></select></label>
      <label><span>Categoria</span><select id="selectCategoria"><option value="">Todas as categorias</option></select></label>
    </section>

    <div class="rl-kpis">
      <section class="section-card rl-kpi">
        <small>Total gasto</small>
        <div class="rl-kpi-valor" id="kpiTotal">R$ 0,00</div>
        <small id="kpiTotalSub">—</small>
      </section>
      <section class="section-card rl-kpi">
        <small>Maior categoria</small>
        <div class="rl-kpi-valor rl-kpi-texto" id="kpiMaior">—</div>
        <small id="kpiMaiorSub">—</small>
      </section>
      <section class="section-card rl-kpi">
        <small>Lançamentos</small>
        <div class="rl-kpi-valor" id="kpiQtd">0</div>
        <small id="kpiQtdSub">—</small>
      </section>
    </div>

    <!-- Modal de Categorias -->
    <div id="modalCategorias" class="modal-overlay">
      <div class="modal-content modal-categorias">
        <div class="rl-modal-head">
          <h3>Administrar categorias</h3>
          <button type="button" class="fin-entry-x" onclick="fecharModalCategorias()" aria-label="Fechar">&times;</button>
        </div>
        <div class="form-row">
          <input type="text" id="novaCategoria" placeholder="Nome da categoria" />
          <button class="btn-add" onclick="finRunOnce(event, () => adicionarCategoria())">Adicionar categoria</button>
        </div>
        <p class="icone-rotulo">Ícone</p>
        <div class="icone-grade" id="gradeIconeNova"></div>
        <div id="listaCategorias" style="margin-top: 16px;">
          <!-- Categorias serão listadas aqui -->
        </div>
        <div style="margin-top: 20px; text-align: center;">
          <button class="btn-cancel" onclick="fecharModalCategorias()">Fechar</button>
        </div>
      </div>
    </div>

    <section class="section-card">
      <h2 class="section-card-title" id="tituloGrafico">Ranking de categorias</h2>
      <div id="graficoCategorias" class="rl-ranking"></div>
    </section>

    <section class="section-card">
      <h2 class="section-card-title">Detalhes por categoria <small class="rl-dica">clique para ver todos os itens</small></h2>
      <div id="relatorios"></div>
    </section>

    <!-- Modal para exibir itens da categoria -->
    <div id="modalItensCategoria" class="modal-overlay">
      <div class="modal-content">
        <div class="rl-modal-head">
          <h3 id="modalCategoriaTitulo">Itens da categoria</h3>
          <button type="button" class="fin-entry-x" onclick="fecharModalItensCategoria()" aria-label="Fechar">&times;</button>
        </div>
        <div id="modalCategoriaTotal" class="total-categoria"></div>
        <div id="modalCategoriaItens" class="modal-itens-lista">
          <!-- Itens serão populados via JS -->
        </div>
        <div id="modalCategoriaSemCategoria" style="display: none;">
          <div class="form-row" style="margin-top: 16px;">
            <select id="modalCategoriaSelect" style="flex: 1;">
              <option value="">Selecione uma categoria</option>
            </select>
            <button class="btn-add" onclick="finRunOnce(event, () => salvarCategoriaModal())">Adicionar</button>
          </div>
        </div>
        <div style="margin-top: 20px; text-align: center;">
          <button class="btn-cancel" onclick="fecharModalItensCategoria()">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MESES = [
      "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
      "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
    ];
    const ANO_BASE = 2025;
    const ANO_LIMITE = ANO_BASE + 10;

    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const formatar = valor => moeda.format(Number(valor) || 0);

    let currentUser = null;
    let categoriasCache = [];
    let relatorioSeq = 0;
    let iconeNova = '';
    let iconeManual = false;
    let categoriaIconeAberta = null;

    const SUGESTOES_ICONE = [
      ['alimentacao', ['aliment', 'comida', 'restaur', 'lanche', 'padaria', 'ifood']],
      ['mercado', ['mercado', 'super', 'feira']],
      ['combustivel', ['combust', 'gasolina', 'posto']],
      ['transporte', ['transporte', 'uber', 'onibus', 'ônibus', 'carro', 'moto']],
      ['moradia', ['moradia', 'aluguel', 'casa', 'condom']],
      ['saude', ['saúde', 'saude', 'farmac', 'médic', 'medic', 'plano']],
      ['educacao', ['educ', 'escola', 'curso', 'facul']],
      ['lazer', ['lazer', 'netflix', 'jogo', 'cinema', 'streaming']],
      ['vestuario', ['vestu', 'roupa', 'sapato']],
      ['eletronicos', ['eletr', 'celular', 'notebook']],
      ['viagem', ['viagem', 'hotel', 'passagem']],
      ['pet', ['pet', 'veter', 'ração', 'racao']],
      ['dinheiro', ['salár', 'salar', 'renda', 'invest']],
      ['presente', ['presente']],
      ['beleza', ['beleza', 'barbear', 'cabelo']],
      ['familia', ['famíl', 'famil', 'filho']],
      ['contas', ['luz', 'água', 'agua', 'internet', 'energia', 'telefone']],
    ];

    function escHtml(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function sugerirIcone(nome) {
      const texto = String(nome || '').toLowerCase();
      const achou = SUGESTOES_ICONE.find(([, chaves]) => chaves.some((chave) => texto.includes(chave)));
      return achou ? achou[0] : '';
    }

    function renderizarGradeNova() {
      const grade = document.getElementById('gradeIconeNova');
      grade.innerHTML = window.finFinanceiro.ICONES_CATEGORIA.map(([id, nome]) => (
        `<button type="button" class="icone-opcao${id === iconeNova ? ' on' : ''}" data-icone="${id}" title="${escHtml(nome)}">${window.finFinanceiro.svgIcone(id)}</button>`
      )).join('');
    }

    function svgDaCategoriaLocal(nome) {
      const alvo = String(nome || '').trim().toLowerCase();
      const cat = categoriasCache.find((item) => String(item.nome || '').trim().toLowerCase() === alvo);
      return cat ? window.finFinanceiro.svgIcone(cat.icone) : '';
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileNavMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function abrirModalCategorias() {
      document.getElementById('modalCategorias').classList.add('visible');
      renderizarGradeNova();
      renderizarListaCategorias();
    }

    function fecharModalCategorias() {
      document.getElementById('modalCategorias').classList.remove('visible');
    }

    function irParaResumoAnual() {
      const selectAno = document.getElementById("selectAno");
      const ano = selectAno.value || String(new Date().getFullYear());
      window.location.href = `resumo.html?ano=${encodeURIComponent(ano)}`;
    }

    function popularListaAnos() {
      const selectAno = document.getElementById("selectAno");
      selectAno.innerHTML = "";
      for (let ano = ANO_BASE; ano <= ANO_LIMITE; ano++) {
        const option = document.createElement("option");
        option.value = String(ano);
        option.textContent = String(ano);
        selectAno.appendChild(option);
      }
      const hoje = new Date();
      let anoCorrente = hoje.getFullYear();
      if (anoCorrente < ANO_BASE || anoCorrente > ANO_LIMITE) {
        anoCorrente = ANO_BASE;
      }
      selectAno.value = String(anoCorrente);
    }

    function popularListaMeses() {
      const selectMes = document.getElementById("selectMes");
      selectMes.innerHTML = '<option value="">Todos os meses</option>';
      MESES.forEach(mes => {
        const option = document.createElement("option");
        option.value = mes;
        option.textContent = mes;
        selectMes.appendChild(option);
      });
      // Define o mês atual como padrão
      const hoje = new Date();
      const mesAtual = MESES[hoje.getMonth()];
      selectMes.value = mesAtual;
    }

    async function carregarCategorias() {
      if (!currentUser) return;
      try {
        const categoriasRef = db.collection('users').doc(currentUser.uid).collection('categorias');
        const snapshot = await categoriasRef.get();
        categoriasCache = [];
        snapshot.forEach(doc => {
          categoriasCache.push({ id: doc.id, nome: doc.data().nome, icone: doc.data().icone || '' });
        });
        categoriasCache.sort((a, b) => a.nome.localeCompare(b.nome));
        renderizarListaCategorias();
        popularSelectCategoria();
      } catch (error) {
        console.error("Erro ao carregar categorias:", error);
      }
    }

    function renderizarListaCategorias() {
      const lista = document.getElementById("listaCategorias");
      lista.innerHTML = "";
      if (categoriasCache.length === 0) {
        lista.innerHTML = '<p style="color: var(--text-secondary);">Nenhuma categoria cadastrada.</p>';
        return;
      }
      categoriasCache.forEach(cat => {
        const div = document.createElement("div");
        div.className = "categoria-item";
        const marca = window.finFinanceiro.svgIcone(cat.icone);
        const aberta = categoriaIconeAberta === cat.id;
        const opcoes = window.finFinanceiro.ICONES_CATEGORIA.map(([id, nome]) => (
          `<button type="button" class="icone-opcao${id === cat.icone ? ' on' : ''}" data-icone="${id}" title="${escHtml(nome)}">${window.finFinanceiro.svgIcone(id)}</button>`
        )).join('');
        div.innerHTML = `
          <button type="button" class="cat-icone${aberta ? ' on' : ''}" data-acao="abrir" title="Escolher ícone">${marca || '+'}</button>
          <span>${escHtml(cat.nome)}</span>
          <button type="button" class="btn-inline fin-btn-danger" data-acao="remover">Remover</button>
          ${aberta ? `<div class="icone-editor icone-grade"><button type="button" class="icone-opcao${cat.icone ? '' : ' on'}" data-icone="" title="Sem ícone">—</button>${opcoes}</div>` : ''}
        `;
        div.querySelector('[data-acao="abrir"]').addEventListener('click', () => {
          categoriaIconeAberta = aberta ? null : cat.id;
          renderizarListaCategorias();
        });
        div.querySelector('[data-acao="remover"]').addEventListener('click', (ev) => {
          finRunOnce(ev, () => removerCategoria(cat.id));
        });
        div.querySelectorAll('.icone-editor [data-icone]').forEach((btn) => {
          btn.addEventListener('click', (ev) => {
            finRunOnce(ev, () => salvarIconeCategoria(cat.id, btn.dataset.icone));
          });
        });
        lista.appendChild(div);
      });
    }

    function popularSelectCategoria() {
      const select = document.getElementById("selectCategoria");
      const valorAtual = select.value;
      select.innerHTML = '<option value="">Todas as categorias</option><option value="Sem categoria">Sem categoria</option>';
      categoriasCache.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat.nome;
        option.textContent = cat.nome;
        select.appendChild(option);
      });
      if (valorAtual) {
        select.value = valorAtual;
      }
    }

    async function adicionarCategoria() {
      if (!currentUser) return;
      const input = document.getElementById("novaCategoria");
      const nome = input.value.trim();
      if (!nome) {
        return alert("Por favor, digite o nome da categoria.");
      }
      if (categoriasCache.some(cat => cat.nome.toLowerCase() === nome.toLowerCase())) {
        return alert("Esta categoria já existe.");
      }
      try {
        const categoriasRef = db.collection('users').doc(currentUser.uid).collection('categorias');
        await categoriasRef.add({ nome: nome, icone: iconeNova || null });
        input.value = "";
        iconeNova = '';
        iconeManual = false;
        renderizarGradeNova();
        await carregarCategorias();
        renderizarListaCategorias();
      } catch (error) {
        console.error("Erro ao adicionar categoria:", error);
        alert("Erro ao adicionar categoria. Tente novamente.");
      }
    }

    async function salvarIconeCategoria(categoriaId, icone) {
      if (!currentUser) return;
      try {
        const categoriaRef = db.collection('users').doc(currentUser.uid).collection('categorias').doc(categoriaId);
        await categoriaRef.update({ icone: icone || null });
        categoriaIconeAberta = null;
        await carregarCategorias();
      } catch (error) {
        console.error('Erro ao salvar ícone:', error);
        alert('Não foi possível salvar o ícone.');
      }
    }

    async function removerCategoria(categoriaId) {
      if (!currentUser) return;
      if (!confirm("Tem certeza que deseja remover esta categoria?")) {
        return;
      }
      try {
        const categoriaRef = db.collection('users').doc(currentUser.uid).collection('categorias').doc(categoriaId);
        await categoriaRef.delete();
        await carregarCategorias();
        renderizarListaCategorias();
      } catch (error) {
        console.error("Erro ao remover categoria:", error);
        alert("Erro ao remover categoria. Tente novamente.");
      }
    }

    async function carregarRelatorios() {
      if (!currentUser) return;
      const selectAno = document.getElementById("selectAno");
      const selectMes = document.getElementById("selectMes");
      const selectCategoria = document.getElementById("selectCategoria");
      const ano = selectAno.value;
      const mes = selectMes.value;
      const categoriaFiltro = selectCategoria.value;

      if (!ano) return;

      const seq = ++relatorioSeq;
      const relatoriosDiv = document.getElementById("relatorios");
      relatoriosDiv.innerHTML = '<div class="rl-vazio">Carregando…</div>';

      try {
        const relatoriosPorCategoria = {};
        const totaisMensaisCategoriaFiltrada = {};
        const mesesParaProcessar = mes ? [mes] : MESES;

        // Ano inteiro numa única requisição (antes eram 12 chamadas em série,
        // ~15s; agora ~1s).
        const resumo = await window.finApi.request(`/api/financeiro/anos/${ano}/resumo`);
        if (seq !== relatorioSeq) return;
        const mesesDoAno = resumo.meses || {};

        for (const mesNome of mesesParaProcessar) {
          if (!totaisMensaisCategoriaFiltrada[mesNome]) {
            totaisMensaisCategoriaFiltrada[mesNome] = 0;
          }
          const data = mesesDoAno[mesNome];
          if (!data) continue;

          const tipos = ['contas', 'cartao', 'reservado', 'debito'];

          tipos.forEach(tipo => {
            const itens = data[tipo] || [];
            itens.forEach((item, index) => {
              const categoria = item.categoria || "Sem categoria";
              if (categoriaFiltro && categoria !== categoriaFiltro) return;

              if (!relatoriosPorCategoria[categoria]) {
                relatoriosPorCategoria[categoria] = {
                  total: 0,
                  itens: [],
                  mes: mesNome
                };
              }
              const valorItem = Number(item.valor || 0);
              relatoriosPorCategoria[categoria].total += valorItem;
              if (categoriaFiltro && categoria === categoriaFiltro) {
                totaisMensaisCategoriaFiltrada[mesNome] += valorItem;
              }
              relatoriosPorCategoria[categoria].itens.push({
                ...item,
                tipo: tipo,
                mes: mesNome,
                ano: ano,
                index: index // Índice do item no array
              });
            });
          });
        }

        renderizarRelatorios(relatoriosPorCategoria, mes, categoriaFiltro);
        atualizarIndicadores({ ...relatoriosPorCategoria }, ano, mes, categoriaFiltro);
        atualizarGrafico(relatoriosPorCategoria, {
          ano,
          mesSelecionado: mes,
          categoriaSelecionada: categoriaFiltro,
          totaisMensaisCategoriaFiltrada
        });
      } catch (error) {
        console.error("Erro ao carregar relatórios:", error);
        relatoriosDiv.innerHTML = '<div class="rl-vazio" style="color:var(--negative);">Não foi possível carregar os relatórios.</div>';
      }
    }

    const CORES_RANKING = ['#2563eb', '#7c3aed', '#0d9488', '#f59e0b', '#ec4899', '#0ea5e9', '#64748b', '#16a34a'];

    function atualizarGrafico(relatoriosPorCategoria, contexto = {}) {
      const host = document.getElementById('graficoCategorias');
      const titulo = document.getElementById('tituloGrafico');
      if (!host) return;

      const mostrarPorMes = !contexto.mesSelecionado && !!contexto.categoriaSelecionada;
      let linhas;
      if (mostrarPorMes) {
        titulo.textContent = `${contexto.categoriaSelecionada} mês a mês`;
        linhas = MESES.map((mesNome) => ({
          nome: mesNome,
          valor: Number(contexto.totaisMensaisCategoriaFiltrada?.[mesNome] || 0),
          categoria: contexto.categoriaSelecionada,
          mes: mesNome,
        }));
      } else {
        titulo.textContent = 'Ranking de categorias';
        linhas = Object.entries(relatoriosPorCategoria)
          .map(([nome, dados]) => ({ nome, valor: dados.total, categoria: nome }))
          .sort((a, b) => b.valor - a.valor);
      }

      const total = linhas.reduce((s, l) => s + l.valor, 0);
      if (!linhas.length || total <= 0) {
        host.innerHTML = '<div class="rl-vazio">Nenhum gasto encontrado para os filtros escolhidos.</div>';
        return;
      }

      const maximo = Math.max(...linhas.map((l) => l.valor));
      host.innerHTML = '';
      linhas.forEach((linha, i) => {
        const pct = total > 0 ? (linha.valor / total) * 100 : 0;
        const cor = mostrarPorMes ? '#2563eb' : CORES_RANKING[i % CORES_RANKING.length];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rl-barra-linha';
        const icone = mostrarPorMes ? '' : svgDaCategoriaLocal(linha.nome);
        btn.innerHTML = `
          <span class="rl-barra-nome">${icone}<span>${escHtml(linha.nome)}</span></span>
          <span class="rl-trilho"><div style="width:${maximo ? (linha.valor / maximo) * 100 : 0}%;background:${cor}"></div></span>
          <span class="rl-barra-valor">${formatar(linha.valor)}<small>${pct.toFixed(1).replace('.', ',')}%</small></span>
        `;
        const dados = relatoriosPorCategoria[linha.categoria];
        if (!dados || linha.valor <= 0) {
          btn.disabled = true;
        } else if (mostrarPorMes) {
          const itensMes = dados.itens.filter((item) => item.mes === linha.mes);
          btn.addEventListener('click', () => abrirModalItensCategoria(
            linha.categoria,
            { total: linha.valor, itens: itensMes },
            false,
            linha.categoria === 'Sem categoria',
            linha.mes,
          ));
        } else {
          btn.addEventListener('click', () => abrirModalItensCategoria(
            linha.categoria,
            dados,
            !contexto.mesSelecionado,
            linha.categoria === 'Sem categoria',
          ));
        }
        host.appendChild(btn);
      });
    }

    function atualizarIndicadores(relatoriosPorCategoria, ano, mes, categoriaFiltro) {
      const entradas = Object.entries(relatoriosPorCategoria);
      const total = entradas.reduce((s, [, d]) => s + d.total, 0);
      const qtd = entradas.reduce((s, [, d]) => s + d.itens.length, 0);
      const periodoTexto = mes ? `${mes} de ${ano}` : `Ano de ${ano}`;
      document.getElementById('rlSub').textContent = categoriaFiltro
        ? `${periodoTexto} · ${categoriaFiltro}`
        : `${periodoTexto} · gastos por categoria`;

      document.getElementById('kpiTotal').textContent = formatar(total);
      document.getElementById('kpiTotalSub').textContent = periodoTexto;

      const maior = entradas.sort((a, b) => b[1].total - a[1].total)[0];
      document.getElementById('kpiMaior').textContent = maior ? maior[0] : '—';
      document.getElementById('kpiMaiorSub').textContent = maior && total > 0
        ? `${formatar(maior[1].total)} · ${Math.round((maior[1].total / total) * 100)}% do total`
        : 'Sem gastos no período';

      document.getElementById('kpiQtd').textContent = String(qtd);
      const semCategoria = relatoriosPorCategoria['Sem categoria'];
      document.getElementById('kpiQtdSub').textContent = semCategoria
        ? `${semCategoria.itens.length} sem categoria`
        : 'Todos categorizados';
    }

    // Armazena os dados completos para o modal
    let dadosCompletosRelatorios = {};

    function renderizarRelatorios(relatoriosPorCategoria, mesSelecionado = '', categoriaFiltro = '') {
      const relatoriosDiv = document.getElementById("relatorios");
      relatoriosDiv.innerHTML = "";

      const categorias = Object.keys(relatoriosPorCategoria).sort();
      if (categorias.length === 0) {
        relatoriosDiv.innerHTML = '<div class="rl-vazio">Nenhum dado encontrado para os filtros escolhidos.</div>';
        return;
      }

      // Armazena os dados completos para usar no modal
      dadosCompletosRelatorios = relatoriosPorCategoria;

      // Verifica se "Todos os meses" está selecionado (valor vazio)
      const mostrarMes = !mesSelecionado || mesSelecionado === '';
      const dividirCardsPorMes = mostrarMes && !!categoriaFiltro;

      let totalGeral = 0;

      // Container para os cards
      const cardsContainer = document.createElement("div");
      cardsContainer.className = "categoria-cards";

      function anexarCardCategoria(categoria, dados, opcoes = {}) {
        const {
          rotuloPrincipal = categoria,
          mostrarMesNoPreview = mostrarMes,
          tituloModalMes = null
        } = opcoes;

        totalGeral += dados.total;

        const ehSemCategoria = categoria === "Sem categoria";

        const itensPreview = dados.itens.slice(0, 3);
        const totalItens = dados.itens.length;
        const temMaisItens = totalItens > 3;

        const card = document.createElement("div");
        card.className = "categoria-card";
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        const mostrarMesNoModal = tituloModalMes ? false : mostrarMes;
        card.onclick = () => abrirModalItensCategoria(categoria, dados, mostrarMesNoModal, ehSemCategoria, tituloModalMes);
        card.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); card.onclick(); } };

        let itensHTML = '';
        if (itensPreview.length > 0) {
          itensHTML = itensPreview.map(item => {
            const descricao = item.nome || '-';
            const descricaoTruncada = descricao.length > 25 ? descricao.substring(0, 25) + '...' : descricao;
            const mesAbreviado = mostrarMesNoPreview && item.mes ? item.mes.substring(0, 3) : '';
            return `
              <div class="categoria-card-item">
                <span class="categoria-card-item-nome">${descricaoTruncada}${mesAbreviado ? ` <span style="color: var(--text-secondary); font-size: 11px;">${mesAbreviado}</span>` : ''}</span>
                <span class="categoria-card-item-valor">${formatar(item.valor || 0)}</span>
              </div>
            `;
          }).join('');
        } else {
          itensHTML = '<div class="categoria-card-item" style="color: var(--text-secondary);">Nenhum item</div>';
        }

        card.innerHTML = `
          <div class="categoria-card-header">
            <div class="categoria-card-nome">${svgDaCategoriaLocal(categoria)}<span>${rotuloPrincipal}</span></div>
            <div class="categoria-card-valor">${formatar(dados.total)}</div>
          </div>
          <div class="categoria-card-itens">
            ${itensHTML}
            ${temMaisItens ? `<div class="categoria-card-ver-mais">+${totalItens - 3} mais itens</div>` : ''}
          </div>
        `;

        cardsContainer.appendChild(card);
      }

      if (dividirCardsPorMes && categorias.length === 1) {
        const categoria = categorias[0];
        const dados = relatoriosPorCategoria[categoria];
        totalGeral = 0;
        MESES.forEach(mesNome => {
          const itensMes = dados.itens.filter(item => item.mes === mesNome);
          if (!itensMes.length) return;
          const totalMes = itensMes.reduce((s, i) => s + Number(i.valor || 0), 0);
          const dadosMes = { total: totalMes, itens: itensMes };
          const rotulo = `${mesNome}<span style="display:block;font-size:14px;font-weight:500;color:var(--text-secondary);margin-top:4px;">${categoria}</span>`;
          anexarCardCategoria(categoria, dadosMes, {
            rotuloPrincipal: rotulo,
            mostrarMesNoPreview: false,
            tituloModalMes: mesNome
          });
        });
      } else {
        categorias.forEach(categoria => {
          const dados = relatoriosPorCategoria[categoria];
          anexarCardCategoria(categoria, dados);
        });
      }

      relatoriosDiv.appendChild(cardsContainer);
    }

    function abrirModalItensCategoria(categoria, dados, mostrarMes, ehSemCategoria, mesNoTitulo = null) {
      const modal = document.getElementById('modalItensCategoria');
      const titulo = document.getElementById('modalCategoriaTitulo');
      const total = document.getElementById('modalCategoriaTotal');
      const itensDiv = document.getElementById('modalCategoriaItens');
      const semCategoriaDiv = document.getElementById('modalCategoriaSemCategoria');

      titulo.textContent = mesNoTitulo ? `${categoria} — ${mesNoTitulo}` : categoria;
      total.innerHTML = `${dados.itens.length} ${dados.itens.length === 1 ? 'item' : 'itens'} · total <b>${formatar(dados.total)}</b>`;

      itensDiv.innerHTML = '';

      if (dados.itens.length === 0) {
        itensDiv.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Nenhum item encontrado.</p>';
      } else {
        dados.itens.forEach((item, index) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "modal-item-linha";

          const descricao = item.nome || '-';
          const mesAbreviado = mostrarMes && item.mes ? item.mes.substring(0, 3) : '';
          const mesSpan = mesAbreviado ? `<span class="modal-item-mes">${mesAbreviado}</span>` : '';

          const origem = { contas: 'Conta', cartao: 'Cartão', debito: 'Débito', reservado: 'Reserva' }[item.tipo] || '';
          itemDiv.innerHTML = `
            <div class="modal-item-descricao">${escHtml(descricao)}${mesSpan}<small>${origem}</small></div>
            <div class="modal-item-valor">${formatar(item.valor || 0)}</div>
          `;

          itensDiv.appendChild(itemDiv);
        });
      }

      // Se for categoria "Sem categoria", mostra o formulário para adicionar categoria
      if (ehSemCategoria) {
        semCategoriaDiv.style.display = 'block';
        const select = document.getElementById('modalCategoriaSelect');
        select.innerHTML = '<option value="">Selecione uma categoria</option>';
        categoriasCache.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat.nome;
          option.textContent = cat.nome;
          select.appendChild(option);
        });
        // Armazena os itens sem categoria para poder salvar depois
        window.itensSemCategoriaModal = dados.itens;
      } else {
        semCategoriaDiv.style.display = 'none';
      }

      modal.classList.add('visible');

      // Adiciona listener para fechar ao clicar fora do modal
      modal.onclick = function(event) {
        // Se o clique foi diretamente no overlay (não no conteúdo do modal)
        if (event.target === modal) {
          fecharModalItensCategoria();
        }
      };
    }

    function fecharModalItensCategoria() {
      const modal = document.getElementById('modalItensCategoria');
      modal.classList.remove('visible');
      // Remove o listener ao fechar
      modal.onclick = null;
    }

    // Cada tipo de lançamento tem seu próprio endpoint granular — a mesma
    // rota usada pelas páginas de Contas/Cartões/Reservados. Atualizar por
    // uuid (item.id) em vez de índice de array elimina a race condition que
    // existia aqui antes (ler o mês inteiro, mudar por posição no array,
    // regravar o mês inteiro — se o array mudasse nesse meio-tempo, a
    // categoria podia ser aplicada ao lançamento errado).
    const ENDPOINT_POR_TIPO = {
      contas: '/api/financeiro/contas',
      debito: '/api/financeiro/debitos',
      reservado: '/api/financeiro/reservados',
      cartao: '/api/financeiro/compras-cartao',
    };

    async function salvarCategoriaModal() {
      const select = document.getElementById('modalCategoriaSelect');
      const categoria = select.value.trim();
      if (!categoria) {
        return alert("Por favor, selecione uma categoria.");
      }

      const itens = window.itensSemCategoriaModal || [];
      if (itens.length === 0) {
        return alert("Nenhum item para atualizar.");
      }

      try {
        const resultados = await Promise.allSettled(
          itens.map((item) => {
            const base = ENDPOINT_POR_TIPO[item.tipo];
            if (!base || !item.id) return Promise.reject(new Error('Item sem id.'));
            return window.finApi.request(`${base}/${item.id}`, {
              method: 'PUT',
              body: JSON.stringify({ categoria }),
            });
          })
        );
        const falhas = resultados.filter((r) => r.status === 'rejected');
        if (falhas.length) {
          console.error('Falhas ao salvar categoria:', falhas);
          alert(`${itens.length - falhas.length} de ${itens.length} item(ns) atualizado(s). Alguns falharam — tente novamente.`);
        } else {
          alert(`${itens.length} item(ns) atualizado(s) com sucesso!`);
        }
        fecharModalItensCategoria();
        await carregarRelatorios();
      } catch (error) {
        console.error("Erro ao salvar categorias:", error);
        alert("Erro ao salvar categorias. Tente novamente.");
      }
    }
    // removido: salvarTodasCategorias() era código morto — procurava selects
    // `categoriaSelect_*` que não existem em lugar nenhum do HTML; o botão
    // "Salvar Alterações de Categorias" que a chamava também foi removido.
    // O fluxo real de categorização é o modal por card, acima.

    ['selectAno', 'selectMes', 'selectCategoria'].forEach((id) => {
      document.getElementById(id).addEventListener('change', () => carregarRelatorios());
    });

    document.getElementById('gradeIconeNova').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-icone]');
      if (!btn) return;
      iconeNova = btn.dataset.icone;
      iconeManual = true;
      renderizarGradeNova();
    });
    document.getElementById('novaCategoria').addEventListener('input', () => {
      if (iconeManual) return;
      iconeNova = sugerirIcone(document.getElementById('novaCategoria').value);
      renderizarGradeNova();
    });

    // Fechar modal ao clicar fora
    document.addEventListener('click', (e) => {
      const modal = document.getElementById('modalCategorias');
      if (e.target === modal) {
        fecharModalCategorias();
      }
    });

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        popularListaAnos();
        popularListaMeses();
        await carregarCategorias();
        // Carrega automaticamente o relatório do mês atual
        await carregarRelatorios();
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
  <script src="js/mobile-nav.js?v=13"></script>
</body>
