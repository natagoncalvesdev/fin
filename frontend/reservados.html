<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservados | Fin</title>
  <link rel="icon" href="img/icone.ico" type="image/x-icon" />
  <link rel="stylesheet" href="sidebar.css?v=6">
  <link rel="stylesheet" href="css/theme.css?v=6">
  <link rel="stylesheet" href="css/mobile-shell.css?v=7">
  <script src="js/fin-run-once.js"></script>
  <script src="js/fin-config.js?v=1"></script>
  <script src="js/fin-sdk.js?v=4"></script>
  <script src="js/fin-financeiro-shared.js?v=4"></script>
  <script src="sidebar.js?v=6"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--bg-main);
      display: flex;
      min-height: 100vh;
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 40px;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 820px;
    }
  </style>
</head>
<body>

  <main class="content">
    <div class="page-header-row">
      <div class="page-header">
        <h1>Reservados</h1>
        <p id="tituloPeriodo">Carregando…</p>
      </div>
      <div class="period-controls" style="display:flex; gap:10px;">
        <select id="selectAno" style="min-width:110px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border-color); background:var(--bg-section); color:var(--text-primary);"></select>
        <select id="selectMes" style="min-width:140px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border-color); background:var(--bg-section); color:var(--text-primary);"></select>
      </div>
    </div>

    <section class="section-card">
      <div class="page-header-row" style="margin-bottom:16px;">
        <h2 class="section-card-title" style="margin:0;">Combustível, lazer e outras reservas</h2>
        <button class="btn-add" id="btnAddReservado">+ Adicionar</button>
      </div>
      <div id="listaReservado" class="statement-list"></div>
    </section>
  </main>

  <!-- Modal: adicionar reservado -->
  <div id="reservadoModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Adicionar valor reservado</h3>
      <div class="form-row" style="flex-direction: column; gap: 14px;">
        <div>
          <label class="fin-field-label" for="reservadoNomeModal">Descrição</label>
          <input id="reservadoNomeModal" placeholder="Descrição" />
        </div>
        <div>
          <label class="fin-field-label" for="reservadoValorModal">Valor</label>
          <input id="reservadoValorModal" type="number" step="0.01" placeholder="Valor em R$" />
        </div>
        <div>
          <label class="fin-field-label" for="reservadoCategoriaModal">Categoria</label>
          <select id="reservadoCategoriaModal"><option value="">Selecione uma categoria</option></select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="reservadoModalCancelar">Cancelar</button>
        <button class="btn-confirm" id="reservadoModalSalvar">Adicionar</button>
      </div>
    </div>
  </div>

  <script>
    const auth = firebase.auth();
    const F = window.finFinanceiro;

    let periodo = null;
    let observador = null;

    function renderizarReservados(itens) {
      const lista = document.getElementById('listaReservado');
      lista.innerHTML = '';
      if (!itens.length) {
        lista.innerHTML = '<div class="statement-empty">Nenhum valor reservado neste mês.</div>';
        return;
      }
      itens.forEach((item) => {
        const row = F.renderStatementRow({
          titulo: item.nome,
          subtitulo: item.categoria || '',
          valor: item.valor,
          onClick: () => F.abrirModalItem({
            tipo: 'reservado',
            item,
            onSalvo: () => observador && observador.forcar(),
            onExcluido: () => observador && observador.forcar(),
          }),
        });
        lista.appendChild(row);
      });
    }

    const reservadoModal = document.getElementById('reservadoModal');
    document.getElementById('btnAddReservado').addEventListener('click', () => {
      document.getElementById('reservadoNomeModal').value = '';
      document.getElementById('reservadoValorModal').value = '';
      F.popularSelectsCategoria(['reservadoCategoriaModal']);
      document.getElementById('reservadoCategoriaModal').value = '';
      reservadoModal.classList.add('visible');
    });
    document.getElementById('reservadoModalCancelar').addEventListener('click', () => reservadoModal.classList.remove('visible'));
    reservadoModal.addEventListener('click', (ev) => { if (ev.target === reservadoModal) reservadoModal.classList.remove('visible'); });

    async function salvarNovoReservado() {
      const nome = document.getElementById('reservadoNomeModal').value.trim();
      const valor = Number(document.getElementById('reservadoValorModal').value);
      const categoria = document.getElementById('reservadoCategoriaModal').value.trim();
      if (!nome || !valor || valor <= 0) {
        window.finToast?.('Preencha descrição e valor.', { type: 'error' });
        return;
      }
      try {
        await F.api('/api/financeiro/reservados', {
          method: 'POST',
          body: JSON.stringify({ ano: Number(periodo.ano), mes: periodo.mes, nome, valor, categoria }),
        });
        reservadoModal.classList.remove('visible');
        window.finToast?.('Reservado adicionado.', { type: 'success' });
        observador && observador.forcar();
      } catch (err) {
        window.finToast?.(err.message || 'Não foi possível adicionar.', { type: 'error' });
      }
    }
    document.getElementById('reservadoModalSalvar').addEventListener('click', (e) => finRunOnce(e, salvarNovoReservado));

    async function iniciar() {
      periodo = F.criarControladorPeriodo({
        selectAno: document.getElementById('selectAno'),
        selectMes: document.getElementById('selectMes'),
        onChange: (ano, mes) => {
          document.getElementById('tituloPeriodo').textContent = `${mes} / ${ano}`;
          if (observador) observador.parar();
          observador = F.observarMes(() => ({ ano, mes }), (data) => renderizarReservados(data.reservado || []));
        },
      });
      await F.carregarCategorias();
    }

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      iniciar();
    });
  </script>
  <script src="js/mobile-nav.js?v=10"></script>
</body>
</html>
