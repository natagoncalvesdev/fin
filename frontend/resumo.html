<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo Anual | Controle</title>
  <link rel="icon" href="img/icone.ico" type="image/x-icon" />
  <link rel="stylesheet" href="sidebar.css?v=8">
  <link rel="stylesheet" href="css/theme.css?v=6">
  <link rel="stylesheet" href="css/mobile-shell.css?v=7">
  <script src="js/fin-config.js?v=1"></script>
  <script src="js/fin-sdk.js?v=5"></script>
  <script src="sidebar.js?v=8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-family);
      display: flex;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 40px;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1180px;
    }

    .chart-box {
      position: relative;
      height: 320px;
    }

    @media (max-width: 768px) {
      .content { max-width: 100%; }
      .chart-box { height: 260px; }
    }
  </style>
</head>
<body>

  <main class="content">
    <div class="page-header-row" style="margin-bottom: 8px;">
      <div class="page-header">
        <h1>Resumo financeiro anual</h1>
        <p id="infoUsuario">Carregando usuário...</p>
      </div>
      <div class="period-controls form-row">
        <select id="selectAnoResumo"></select>
        <button class="btn-cancel" onclick="window.location.href='index.html'">Voltar</button>
      </div>
    </div>

    <section class="section-card">
      <h3 class="section-card-title">Totais do ano <span id="tituloAnoResumo"></span></h3>
      <div class="stat-row">
        <div class="stat-tile negative">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Contas (c/ cartão e débito)</span><span class="stat-tile-value" id="anualTotalContas">R$ 0,00</span></span>
        </div>
        <div class="stat-tile positive">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Total entradas</span><span class="stat-tile-value" id="anualTotalEntradas">R$ 0,00</span></span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Saldo disponível</span><span class="stat-tile-value" id="anualSaldoDisponivel">R$ 0,00</span></span>
        </div>
        <div class="stat-tile warning">
          <span class="stat-tile-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
          <span class="stat-tile-body"><span class="stat-tile-label">Total reservado</span><span class="stat-tile-value" id="anualTotalReservado">R$ 0,00</span></span>
        </div>
      </div>
      <p class="info-text" id="statusCarregamento" style="margin-top: 16px;">Carregando dados do ano...</p>
    </section>

    <section class="section-card">
      <h3 class="section-card-title">Saldo por mês</h3>
      <div class="chart-box"><canvas id="chartSaldoMensal"></canvas></div>
    </section>

    <section class="section-card">
      <h3 class="section-card-title">Detalhamento por mês</h3>
      <div id="tabelaResumoAnual" class="statement-list"></div>
    </section>
  </main>

  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MESES = [
      "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
      "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
    ];
    const ANO_BASE = 2025;
    const ANO_LIMITE = ANO_BASE + 10;

    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const formatar = valor => moeda.format(Number(valor) || 0);

    let currentUser = null;
    let anoAtualResumo = "";

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileNavMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function popularListaAnosResumo() {
      const select = document.getElementById("selectAnoResumo");
      select.innerHTML = "";
      for (let ano = ANO_BASE; ano <= ANO_LIMITE; ano++) {
        const option = document.createElement("option");
        option.value = String(ano);
        option.textContent = String(ano);
        select.appendChild(option);
      }
    }

    function obterAnoInicial() {
      const params = new URLSearchParams(window.location.search);
      const anoParam = params.get("ano");
      let ano = Number(anoParam) || new Date().getFullYear();
      if (ano < ANO_BASE) ano = ANO_BASE;
      if (ano > ANO_LIMITE) ano = ANO_LIMITE;
      return String(ano);
    }

    async function carregarResumoAnual(ano) {
      const statusEl = document.getElementById('statusCarregamento');
      const tituloAnoEl = document.getElementById('tituloAnoResumo');
      const tbody = document.getElementById('tabelaResumoAnual');

      if (tituloAnoEl) tituloAnoEl.textContent = ano;
      if (statusEl) statusEl.textContent = "Carregando dados do ano...";

      if (!currentUser) {
        if (statusEl) statusEl.textContent = "Usuário não autenticado.";
        return;
      }

      // Ano inteiro numa única requisição (antes eram 12 chamadas em série).
      const resumo = await window.finApi.request(`/api/financeiro/anos/${ano}/resumo`);
      const mesesDoAno = resumo.meses || {};

      let totalAnoContas = 0;
      let totalAnoEntradas = 0;
      let totalAnoReservado = 0;

      const linhasMensais = [];

      for (const mesNome of MESES) {
        const data = mesesDoAno[mesNome]
          || { contas: [], adicionais: [], cartao: [], reservado: [], debito: [] };

        const contas = data.contas || [];
        const adicionais = data.adicionais || [];
        const cartao = data.cartao || [];
        const reservado = data.reservado || [];
        const debito = data.debito || [];

        const totalContasManuais = contas.reduce((acc, item) => acc + Number(item.valor || 0), 0);
        const totalCartao = cartao.reduce((acc, item) => acc + Number(item.valor || 0), 0);
        const totalDebitoMes = debito.reduce((acc, item) => acc + Number(item.valor || 0), 0);

        const totalContasMes = totalContasManuais + totalCartao + totalDebitoMes;
        const totalEntradasMes = adicionais.reduce((acc, item) => acc + Number(item.valor || 0), 0);
        const totalReservadoMes = reservado.reduce((acc, item) => acc + Number(item.valor || 0), 0);
        const saldoMes = totalEntradasMes - totalContasMes - totalReservadoMes;

        linhasMensais.push({
          mes: mesNome,
          totalContas: totalContasMes,
          totalCartao: totalCartao,
          totalEntradas: totalEntradasMes,
          saldo: saldoMes,
          totalReservado: totalReservadoMes
        });

        totalAnoContas += totalContasMes;
        totalAnoEntradas += totalEntradasMes;
        totalAnoReservado += totalReservadoMes;
      }

      const saldoAno = totalAnoEntradas - totalAnoContas - totalAnoReservado;

      document.getElementById('anualTotalContas').innerText = formatar(totalAnoContas);
      document.getElementById('anualTotalEntradas').innerText = formatar(totalAnoEntradas);
      document.getElementById('anualSaldoDisponivel').innerText = formatar(saldoAno);
      document.getElementById('anualTotalReservado').innerText = formatar(totalAnoReservado);

      if (tbody) {
        tbody.innerHTML = '';
        linhasMensais.forEach(linha => {
          const mesAbreviado = linha.mes ? linha.mes.substring(0, 3) : '-';
          const row = document.createElement('div');
          row.className = 'statement-row';
          row.style.cursor = 'default';
          row.innerHTML = `
            <span class="statement-row-icon">${mesAbreviado}</span>
            <span class="statement-row-body">
              <span class="statement-row-title">${linha.mes}</span>
              <span class="statement-row-subtitle">Contas ${formatar(linha.totalContas)} · Cartão ${formatar(linha.totalCartao)} · Entradas ${formatar(linha.totalEntradas)} · Reservado ${formatar(linha.totalReservado)}</span>
            </span>
            <span class="statement-row-end">
              <span class="statement-row-value ${linha.saldo < 0 ? 'negative' : 'positive'}">${formatar(linha.saldo)}</span>
            </span>
          `;
          tbody.appendChild(row);
        });
      }

      atualizarChartSaldoMensal(linhasMensais);

      if (statusEl) statusEl.textContent = "Dados carregados com sucesso.";
    }

    let chartSaldoMensal = null;
    function atualizarChartSaldoMensal(linhasMensais) {
      const canvas = document.getElementById('chartSaldoMensal');
      if (!canvas || typeof Chart === 'undefined') return;
      if (chartSaldoMensal) { chartSaldoMensal.destroy(); chartSaldoMensal = null; }

      const labels = linhasMensais.map((l) => l.mes.slice(0, 3));
      const valores = linhasMensais.map((l) => l.saldo);
      const cores = valores.map((v) => (v < 0 ? '#B91C1C' : '#2563EB'));

      chartSaldoMensal = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: { labels, datasets: [{ data: valores, backgroundColor: cores, borderRadius: 6, maxBarThickness: 40 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${formatar(c.parsed.y)}` } } },
          scales: {
            y: { ticks: { callback: (v) => formatar(v), font: { size: 11 } }, grid: { color: 'rgba(148,163,184,0.15)' } },
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          },
        },
      });
    }

    async function inicializarResumo() {
      popularListaAnosResumo();
      anoAtualResumo = obterAnoInicial();

      const selectAnoResumo = document.getElementById("selectAnoResumo");
      selectAnoResumo.value = anoAtualResumo;

      selectAnoResumo.addEventListener("change", async (e) => {
        anoAtualResumo = e.target.value;
        await carregarResumoAnual(anoAtualResumo);
      });

      await carregarResumoAnual(anoAtualResumo);
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        const infoUsuario = document.getElementById('infoUsuario');
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          const dados = doc.exists ? doc.data() : {};
          const nome = dados.name || user.displayName || user.email || 'Usuário';
          if (infoUsuario) infoUsuario.textContent = `Resumo de: ${nome}`;
        } catch (e) {
          if (infoUsuario) infoUsuario.textContent = `Resumo de: ${user.email || 'Usuário'}`;
        }
        inicializarResumo();
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
  <script src="js/mobile-nav.js?v=10"></script>
</body>
</html>
